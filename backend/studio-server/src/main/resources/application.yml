server:
  port: 18080

spring:
  application:
    name: studio-server
  profiles:
    active: ${APP_ACTIVE:prod}
  config:
    import:
      - optional:nacos:${spring.application.name}-${spring.profiles.active}.${spring.cloud.nacos.config.file-extension}
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://192.168.188.129:3306/data_aggregation_studio?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true}
    username: ${SPRING_DATASOURCE_USERNAME:root}
    password: ${SPRING_DATASOURCE_PASSWORD:951753}
    driver-class-name: ${SPRING_DATASOURCE_DRIVER_CLASS_NAME:com.mysql.cj.jdbc.Driver}
  sql:
    init:
      mode: always
      schema-locations: classpath:schema-mysql.sql
  jackson:
    serialization:
      write-dates-as-timestamps: false
  cloud:
    nacos:
      username: ${NACOS_USER:nacos}
      password: ${NACOS_PASSWORD:Wjoms_2020}
      discovery:
        enabled: true
        server-addr: ${NACOS_SERVER:127.0.0.1:8848}
        namespace: ${NACOS_NAMESPACE:ZCYY}
        group: ${NACOS_GROUP:ZCYY_GROUP}
      config:
        enabled: true
        server-addr: ${NACOS_SERVER:127.0.0.1:8848}
        namespace: ${NACOS_NAMESPACE:ZCYY}
        group: ${NACOS_GROUP:ZCYY_GROUP}
        file-extension: yaml
        import-check:
          enabled: false

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true
    disable-swagger-default-url: true
    urls:
      - name: default
        url: /v3/api-docs

knife4j:
  enable: true

management:
  endpoints:
    web:
      exposure:
        include: health,info

studio:
  aggregation-home: ${STUDIO_AGGREGATION_HOME:C:/dev/ideaProject/DataAggregation/package_all/aggregation}
  encryption-secret: studio-secret-key
  worker-code: studio-server-worker
  internal-api-token: ${STUDIO_INTERNAL_API_TOKEN:studio-internal-token}
  gateway:
    trust-enabled: ${STUDIO_GATEWAY_TRUST_ENABLED:true}
    shared-secret: ${STUDIO_GATEWAY_SHARED_SECRET:change-me}
    signature-expire-seconds: ${STUDIO_GATEWAY_SIGNATURE_EXPIRE_SECONDS:300}
  model-sync-task:
    max-concurrency: ${STUDIO_MODEL_SYNC_TASK_MAX_CONCURRENCY:1}
  python:
    executable: ${STUDIO_PYTHON_EXECUTABLE:}
    execution-timeout-seconds: ${STUDIO_PYTHON_TIMEOUT_SECONDS:120}
    temp-dir: ${STUDIO_PYTHON_TEMP_DIR:}
