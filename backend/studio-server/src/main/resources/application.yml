server:
  port: 18080
  tomcat:
    max-http-form-post-size: ${STUDIO_TOMCAT_MAX_FORM_POST_SIZE:73400320}

spring:
  application:
    name: studio-server
  profiles:
    active: ${APP_ACTIVE:prod}
  config:
    import:
      - optional:nacos:${spring.application.name}-${spring.profiles.active}.${spring.cloud.nacos.config.file-extension}
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://192.168.188.129:3306/data_aggregation_studio?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true}
    username: ${SPRING_DATASOURCE_USERNAME:root}
    password: ${SPRING_DATASOURCE_PASSWORD:951753}
    driver-class-name: ${SPRING_DATASOURCE_DRIVER_CLASS_NAME:com.mysql.cj.jdbc.Driver}
  sql:
    init:
      mode: never
  jackson:
    serialization:
      write-dates-as-timestamps: false
  mvc:
    formcontent:
      filter:
        enabled: false
    async:
      request-timeout: ${STUDIO_MVC_ASYNC_REQUEST_TIMEOUT:300000}
  servlet:
    multipart:
      enabled: true
      max-file-size: ${STUDIO_MULTIPART_MAX_FILE_SIZE:64MB}
      max-request-size: ${STUDIO_MULTIPART_MAX_REQUEST_SIZE:70MB}
      file-size-threshold: 0
  data:
    redis:
      host: ${REDIS_HOST:172.16.20.19}
      port: ${REDIS_PORT:6379}
      database: ${REDIS_DATABASE:1}
      password: '${REDIS_PASSWORD:&gGEa4E3ea4#5}'
  cloud:
    nacos:
      username: ${NACOS_USER:nacos}
      password: ${NACOS_PASSWORD:Wjoms_2020}
      discovery:
        enabled: true
        server-addr: ${NACOS_SERVER:127.0.0.1:8848}
        namespace: ${NACOS_NAMESPACE:ZCYY}
        group: ${NACOS_GROUP:ZCYY_GROUP}
      config:
        enabled: true
        server-addr: ${NACOS_SERVER:127.0.0.1:8848}
        namespace: ${NACOS_NAMESPACE:ZCYY}
        group: ${NACOS_GROUP:ZCYY_GROUP}
        file-extension: yaml
        import-check:
          enabled: false
  arthas:
    enabled: ${SPRING_ARTHAS_ENABLED:true}

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true
    disable-swagger-default-url: true
    urls:
      - name: default
        url: /v3/api-docs

knife4j:
  enable: true

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      # The schema-upgrade application shares this file but deliberately does not scan Server web contributors.
      validate-group-membership: false
      group:
        studio-ha:
          include: studioServerHa
          show-components: always
          show-details: always

studio:
  streaming-history:
    cleanup-enabled: ${STUDIO_STREAMING_HISTORY_CLEANUP_ENABLED:false}
    retention-days: ${STUDIO_STREAMING_HISTORY_RETENTION_DAYS:30}
    cleanup-interval-millis: ${STUDIO_STREAMING_HISTORY_CLEANUP_INTERVAL_MILLIS:3600000}
    cleanup-batch-size: ${STUDIO_STREAMING_HISTORY_CLEANUP_BATCH_SIZE:1000}
    cleanup-max-batches: ${STUDIO_STREAMING_HISTORY_CLEANUP_MAX_BATCHES:20}
  schema:
    auto-upgrade-on-startup: false
  auth:
    token-expiration-seconds: ${STUDIO_AUTH_TOKEN_EXPIRATION_SECONDS:43200}
    cookie-path: ${STUDIO_AUTH_COOKIE_PATH:/}
    cookie-secure: ${STUDIO_AUTH_COOKIE_SECURE:false}
    cookie-same-site: ${STUDIO_AUTH_COOKIE_SAME_SITE:Lax}
    cookie-csrf-enabled: ${STUDIO_AUTH_COOKIE_CSRF_ENABLED:false}
  web:
    async-request-timeout: ${STUDIO_WEB_ASYNC_REQUEST_TIMEOUT:300000}
  encryption-secret: ${STUDIO_ENCRYPTION_SECRET:}
  instance-id: ${STUDIO_INSTANCE_ID:${POD_UID:${HOSTNAME:studio-server-local}}}
  pod-name: ${POD_NAME:${HOSTNAME:studio-server-local}}
  node-name: ${NODE_NAME:}
  internal-api-token: ${STUDIO_INTERNAL_API_TOKEN:}
  file-transfer:
    enabled: ${STUDIO_FILE_TRANSFER_ENABLED:true}
    download-ticket-ttl-seconds: ${STUDIO_DOWNLOAD_TICKET_TTL_SECONDS:120}
    download-read-idle-timeout-millis: ${STUDIO_DOWNLOAD_READ_IDLE_TIMEOUT_MILLIS:1800000}
    event-mode: ${STUDIO_FILE_TRANSFER_EVENT_MODE:OUTBOX}
    event-poll-delay-millis: ${STUDIO_FILE_TRANSFER_EVENT_POLL_DELAY_MILLIS:250}
    event-batch-size: ${STUDIO_FILE_TRANSFER_EVENT_BATCH_SIZE:500}
    progress-event-interval-millis: ${STUDIO_FILE_TRANSFER_PROGRESS_EVENT_INTERVAL_MILLIS:1000}
    replay-max-events: ${STUDIO_FILE_TRANSFER_REPLAY_MAX_EVENTS:5000}
    event-retention-days: ${STUDIO_FILE_TRANSFER_EVENT_RETENTION_DAYS:7}
    cursor-stale-hours: ${STUDIO_FILE_TRANSFER_CURSOR_STALE_HOURS:48}
    cleanup-interval-millis: ${STUDIO_FILE_TRANSFER_CLEANUP_INTERVAL_MILLIS:3600000}
    cleanup-batch-size: ${STUDIO_FILE_TRANSFER_CLEANUP_BATCH_SIZE:1000}
    cleanup-max-batches: ${STUDIO_FILE_TRANSFER_CLEANUP_MAX_BATCHES:20}
  runtime-invocation-max-body-bytes: ${STUDIO_RUNTIME_INVOCATION_MAX_BODY_BYTES:10485760}
  runtime-invocation-idempotency:
    mode: ${STUDIO_RUNTIME_INVOCATION_IDEMPOTENCY_MODE:OPTIONAL}
    max-response-bytes: ${STUDIO_RUNTIME_INVOCATION_IDEMPOTENCY_MAX_RESPONSE_BYTES:10485760}
    cleanup-enabled: ${STUDIO_RUNTIME_INVOCATION_IDEMPOTENCY_CLEANUP_ENABLED:true}
    completed-retention-days: ${STUDIO_RUNTIME_INVOCATION_IDEMPOTENCY_COMPLETED_RETENTION_DAYS:7}
    running-unknown-after-hours: ${STUDIO_RUNTIME_INVOCATION_IDEMPOTENCY_RUNNING_UNKNOWN_AFTER_HOURS:24}
    cleanup-batch-size: ${STUDIO_RUNTIME_INVOCATION_IDEMPOTENCY_CLEANUP_BATCH_SIZE:1000}
    cleanup-max-batches: ${STUDIO_RUNTIME_INVOCATION_IDEMPOTENCY_CLEANUP_MAX_BATCHES:20}
  runtime-endpoint:
    allowed-hosts: ${STUDIO_RUNTIME_ENDPOINT_ALLOWED_HOSTS:127.0.0.1}
    max-response-bytes: ${STUDIO_RUNTIME_ENDPOINT_MAX_RESPONSE_BYTES:10485760}
  gateway:
    trust-enabled: ${STUDIO_GATEWAY_TRUST_ENABLED:false}
    shared-secret: ${STUDIO_GATEWAY_SHARED_SECRET:change-me}
    signature-expire-seconds: ${STUDIO_GATEWAY_SIGNATURE_EXPIRE_SECONDS:300}
  assistant:
    llm:
      enabled: ${STUDIO_ASSISTANT_LLM_ENABLED:false}
      base-url: ${STUDIO_ASSISTANT_LLM_BASE_URL:http://8.140.247.113:8317/v1}
      api-key: ${STUDIO_ASSISTANT_LLM_API_KEY:}
      model: ${STUDIO_ASSISTANT_LLM_MODEL:gpt-5.4-mini}
      timeout-seconds: ${STUDIO_ASSISTANT_LLM_TIMEOUT_SECONDS:60}
      temperature: ${STUDIO_ASSISTANT_LLM_TEMPERATURE:0.1}
      max-tokens: ${STUDIO_ASSISTANT_LLM_MAX_TOKENS:1200}
    skill-memory:
      enabled: ${STUDIO_ASSISTANT_SKILL_MEMORY_ENABLED:true}
      local-dir: ${STUDIO_ASSISTANT_SKILL_MEMORY_LOCAL_DIR:./runtime/assistant-skills}
      object-prefix: ${STUDIO_ASSISTANT_SKILL_MEMORY_OBJECT_PREFIX:studio/assistant-skills}
      max-context-skills: ${STUDIO_ASSISTANT_SKILL_MEMORY_MAX_CONTEXT_SKILLS:6}
  model-sync-task:
    max-concurrency: ${STUDIO_MODEL_SYNC_TASK_MAX_CONCURRENCY:1}
  dispatch:
    scheduler-batch-size: ${STUDIO_SCHEDULER_BATCH_SIZE:500}
    cluster-lock-lease-seconds: ${STUDIO_CLUSTER_LOCK_LEASE_SECONDS:120}
  object-storage:
    provider: ${STUDIO_OBJECT_PROVIDER:${STUDIO_RUN_LOG_OBJECT_PROVIDER:MINIO}}
    endpoint: ${STUDIO_OBJECT_ENDPOINT:${STUDIO_RUN_LOG_OBJECT_ENDPOINT:}}
    access-key: ${STUDIO_OBJECT_ACCESS_KEY:${STUDIO_RUN_LOG_OBJECT_ACCESS_KEY:}}
    secret-key: ${STUDIO_OBJECT_SECRET_KEY:${STUDIO_RUN_LOG_OBJECT_SECRET_KEY:}}
    bucket: ${STUDIO_OBJECT_BUCKET:${STUDIO_RUN_LOG_OBJECT_BUCKET:}}
    region: ${STUDIO_OBJECT_REGION:${STUDIO_RUN_LOG_OBJECT_REGION:}}
    create-bucket: ${STUDIO_OBJECT_CREATE_BUCKET:${STUDIO_RUN_LOG_OBJECT_CREATE_BUCKET:true}}
  run-log:
    storage-type: ${STUDIO_RUN_LOG_STORAGE_TYPE:LOCAL}
    object-prefix: ${STUDIO_RUN_LOG_OBJECT_PREFIX:studio/run-logs}
    object-storage:
      provider: ${STUDIO_RUN_LOG_OBJECT_PROVIDER:MINIO}
      endpoint: ${STUDIO_RUN_LOG_OBJECT_ENDPOINT:}
      access-key: ${STUDIO_RUN_LOG_OBJECT_ACCESS_KEY:}
      secret-key: ${STUDIO_RUN_LOG_OBJECT_SECRET_KEY:}
      bucket: ${STUDIO_RUN_LOG_OBJECT_BUCKET:}
      region: ${STUDIO_RUN_LOG_OBJECT_REGION:}
      prefix: ${STUDIO_RUN_LOG_OBJECT_PREFIX:studio/run-logs}
      create-bucket: ${STUDIO_RUN_LOG_OBJECT_CREATE_BUCKET:true}
  invocation-log:
    enabled: ${STUDIO_INVOCATION_LOG_ENABLED:true}
    storage-type: ${STUDIO_INVOCATION_LOG_STORAGE_TYPE:}
    object-prefix: ${STUDIO_INVOCATION_LOG_OBJECT_PREFIX:studio/invocation-logs}
    max-log-chars: ${STUDIO_INVOCATION_LOG_MAX_LOG_CHARS:1048576}
    max-body-chars: ${STUDIO_INVOCATION_LOG_MAX_BODY_CHARS:65536}
  alert:
    enabled: ${STUDIO_ALERT_ENABLED:true}
    evaluation-enabled: ${STUDIO_ALERT_EVALUATION_ENABLED:true}
    delivery-enabled: ${STUDIO_ALERT_DELIVERY_ENABLED:true}
    evaluation-delay-millis: ${STUDIO_ALERT_EVALUATION_DELAY_MILLIS:30000}
    delivery-delay-millis: ${STUDIO_ALERT_DELIVERY_DELAY_MILLIS:5000}
    batch-size: ${STUDIO_ALERT_BATCH_SIZE:100}
    event-retention-days: ${STUDIO_ALERT_EVENT_RETENTION_DAYS:180}
    delivery-retention-days: ${STUDIO_ALERT_DELIVERY_RETENTION_DAYS:30}
    webhook:
      enabled: ${STUDIO_ALERT_WEBHOOK_ENABLED:true}
      allow-http: ${STUDIO_ALERT_WEBHOOK_ALLOW_HTTP:false}
      allowed-hosts: ${STUDIO_ALERT_WEBHOOK_ALLOWED_HOSTS:}
      connect-timeout-seconds: ${STUDIO_ALERT_WEBHOOK_CONNECT_TIMEOUT_SECONDS:3}
      request-timeout-seconds: ${STUDIO_ALERT_WEBHOOK_REQUEST_TIMEOUT_SECONDS:5}
      max-response-bytes: ${STUDIO_ALERT_WEBHOOK_MAX_RESPONSE_BYTES:16384}
    elink:
      enabled: ${STUDIO_ALERT_ELINK_ENABLED:true}
      service-name: ${STUDIO_ALERT_ELINK_SERVICE_NAME:elink-message-integration}
      path-prefix: ${STUDIO_ALERT_ELINK_PATH_PREFIX:/elink}
      connect-timeout-seconds: ${STUDIO_ALERT_ELINK_CONNECT_TIMEOUT_SECONDS:3}
      request-timeout-seconds: ${STUDIO_ALERT_ELINK_REQUEST_TIMEOUT_SECONDS:10}
      max-error-response-bytes: ${STUDIO_ALERT_ELINK_MAX_ERROR_RESPONSE_BYTES:16384}
      max-option-response-bytes: ${STUDIO_ALERT_ELINK_MAX_OPTION_RESPONSE_BYTES:1048576}
  flink:
    client:
      service-name: ${STUDIO_FLINK_SERVICE_NAME:studio-flink}
      base-url: ${STUDIO_FLINK_BASE_URL:http://127.0.0.1:18084}
      path: ${STUDIO_FLINK_CONTEXT_PATH:}


arthas:
  ip: ${ARTHAS_IP:127.0.0.1}
  telnet-port: ${ARTHAS_TELNET_PORT:3658}
  http-port: ${ARTHAS_HTTP_PORT:8563}

  app-name: ${spring.application.name}
  agent-id: ${ARTHAS_AGENT_ID:${spring.application.name}_${studio.instance-id}}

  tunnel-server: ${ARTHAS_TUNNEL_SERVER:ws://127.0.0.1:7777/ws}

  # 开启 MCP Server
  mcp-endpoint: ${ARTHAS_MCP_ENDPOINT:/mcp}
  mcp-protocol: ${ARTHAS_MCP_PROTOCOL:STREAMABLE}

  # 建议通过 Secret 注入，远程暴露时必须配置
  password: ${ARTHAS_PASSWORD:951753}
