server:
  port: 18180

spring:
  application:
    name: studio-desktop-runtime
  datasource:
    url: jdbc:sqlite:${STUDIO_DESKTOP_DB_PATH:${studio.desktop.db.path:./runtime/studio-desktop.db}}
    driver-class-name: org.sqlite.JDBC
  sql:
    init:
      mode: always
      schema-locations: classpath:schema-sqlite.sql
  mvc:
    formcontent:
      filter:
        enabled: false
  jackson:
    serialization:
      write-dates-as-timestamps: false
  cloud:
    nacos:
      discovery:
        enabled: false
      config:
        enabled: false

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true

knife4j:
  enable: true

management:
  endpoints:
    web:
      exposure:
        include: health,info

studio:
  streaming-history:
    cleanup-enabled: ${STUDIO_STREAMING_HISTORY_CLEANUP_ENABLED:false}
    retention-days: ${STUDIO_STREAMING_HISTORY_RETENTION_DAYS:30}
    cleanup-interval-millis: ${STUDIO_STREAMING_HISTORY_CLEANUP_INTERVAL_MILLIS:3600000}
    cleanup-batch-size: ${STUDIO_STREAMING_HISTORY_CLEANUP_BATCH_SIZE:1000}
    cleanup-max-batches: ${STUDIO_STREAMING_HISTORY_CLEANUP_MAX_BATCHES:20}
  alert:
    enabled: ${STUDIO_ALERT_ENABLED:true}
    evaluation-enabled: ${STUDIO_ALERT_EVALUATION_ENABLED:true}
    delivery-enabled: ${STUDIO_ALERT_DELIVERY_ENABLED:true}
    evaluation-delay-millis: ${STUDIO_ALERT_EVALUATION_DELAY_MILLIS:30000}
    delivery-delay-millis: ${STUDIO_ALERT_DELIVERY_DELAY_MILLIS:5000}
    batch-size: ${STUDIO_ALERT_BATCH_SIZE:100}
    event-retention-days: ${STUDIO_ALERT_EVENT_RETENTION_DAYS:180}
    delivery-retention-days: ${STUDIO_ALERT_DELIVERY_RETENTION_DAYS:30}
    webhook:
      enabled: ${STUDIO_ALERT_WEBHOOK_ENABLED:true}
      allow-http: ${STUDIO_ALERT_WEBHOOK_ALLOW_HTTP:false}
      allowed-hosts: ${STUDIO_ALERT_WEBHOOK_ALLOWED_HOSTS:}
      connect-timeout-seconds: ${STUDIO_ALERT_WEBHOOK_CONNECT_TIMEOUT_SECONDS:3}
      request-timeout-seconds: ${STUDIO_ALERT_WEBHOOK_REQUEST_TIMEOUT_SECONDS:5}
      max-response-bytes: ${STUDIO_ALERT_WEBHOOK_MAX_RESPONSE_BYTES:16384}
    elink:
      enabled: ${STUDIO_ALERT_ELINK_ENABLED:false}
      service-name: ${STUDIO_ALERT_ELINK_SERVICE_NAME:elink-message-integration}
      path-prefix: ${STUDIO_ALERT_ELINK_PATH_PREFIX:/elink}
      connect-timeout-seconds: ${STUDIO_ALERT_ELINK_CONNECT_TIMEOUT_SECONDS:3}
      request-timeout-seconds: ${STUDIO_ALERT_ELINK_REQUEST_TIMEOUT_SECONDS:10}
      max-error-response-bytes: ${STUDIO_ALERT_ELINK_MAX_ERROR_RESPONSE_BYTES:16384}
      max-option-response-bytes: ${STUDIO_ALERT_ELINK_MAX_OPTION_RESPONSE_BYTES:1048576}
  schema:
    auto-upgrade-on-startup: true
  aggregation-home: ${STUDIO_AGGREGATION_HOME:${aggregation.home:../../package_all/aggregation}}
  encryption-secret: ${STUDIO_ENCRYPTION_SECRET:studio-desktop-encryption-secret-20260721}
  instance-id: ${STUDIO_INSTANCE_ID:studio-desktop-runtime}
  runtime-cluster-code: ${STUDIO_CLUSTER_CODE:default-local}
  worker-group-code: ${STUDIO_WORKER_GROUP_CODE:${STUDIO_WORKER_CODE:studio-desktop-worker}}
  worker-code: ${STUDIO_WORKER_CODE:studio-desktop-worker}
  worker-api-base-url: ${STUDIO_WORKER_API_BASE_URL:http://127.0.0.1:${server.port}}
  internal-api-token: ${STUDIO_INTERNAL_API_TOKEN:studio-desktop-internal-token-20260721}
  runtime-invocation-max-body-bytes: ${STUDIO_RUNTIME_INVOCATION_MAX_BODY_BYTES:10485760}
  runtime-invocation-max-concurrency: ${STUDIO_RUNTIME_INVOCATION_MAX_CONCURRENCY:32}
  runtime-invocation-idempotency:
    mode: ${STUDIO_RUNTIME_INVOCATION_IDEMPOTENCY_MODE:OPTIONAL}
    max-response-bytes: ${STUDIO_RUNTIME_INVOCATION_IDEMPOTENCY_MAX_RESPONSE_BYTES:10485760}
    cleanup-enabled: ${STUDIO_RUNTIME_INVOCATION_IDEMPOTENCY_CLEANUP_ENABLED:true}
    completed-retention-days: ${STUDIO_RUNTIME_INVOCATION_IDEMPOTENCY_COMPLETED_RETENTION_DAYS:7}
    running-unknown-after-hours: ${STUDIO_RUNTIME_INVOCATION_IDEMPOTENCY_RUNNING_UNKNOWN_AFTER_HOURS:24}
    cleanup-batch-size: ${STUDIO_RUNTIME_INVOCATION_IDEMPOTENCY_CLEANUP_BATCH_SIZE:1000}
    cleanup-max-batches: ${STUDIO_RUNTIME_INVOCATION_IDEMPOTENCY_CLEANUP_MAX_BATCHES:20}
  runtime-endpoint:
    allowed-hosts: ${STUDIO_RUNTIME_ENDPOINT_ALLOWED_HOSTS:127.0.0.1}
    max-response-bytes: ${STUDIO_RUNTIME_ENDPOINT_MAX_RESPONSE_BYTES:10485760}
  desktop-runtime: true
