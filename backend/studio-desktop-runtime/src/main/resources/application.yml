server:
  port: 18180

spring:
  application:
    name: studio-desktop-runtime
  datasource:
    url: jdbc:sqlite:${STUDIO_DESKTOP_DB_PATH:${studio.desktop.db.path:./runtime/studio-desktop.db}}
    driver-class-name: org.sqlite.JDBC
  sql:
    init:
      mode: always
      schema-locations: classpath:schema-sqlite.sql
  jackson:
    serialization:
      write-dates-as-timestamps: false

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true

knife4j:
  enable: true

management:
  endpoints:
    web:
      exposure:
        include: health,info

studio:
  alert:
    enabled: ${STUDIO_ALERT_ENABLED:true}
    evaluation-enabled: ${STUDIO_ALERT_EVALUATION_ENABLED:true}
    delivery-enabled: ${STUDIO_ALERT_DELIVERY_ENABLED:true}
    evaluation-delay-millis: ${STUDIO_ALERT_EVALUATION_DELAY_MILLIS:30000}
    delivery-delay-millis: ${STUDIO_ALERT_DELIVERY_DELAY_MILLIS:5000}
    batch-size: ${STUDIO_ALERT_BATCH_SIZE:100}
    event-retention-days: ${STUDIO_ALERT_EVENT_RETENTION_DAYS:180}
    delivery-retention-days: ${STUDIO_ALERT_DELIVERY_RETENTION_DAYS:30}
    webhook:
      enabled: ${STUDIO_ALERT_WEBHOOK_ENABLED:true}
      allow-http: ${STUDIO_ALERT_WEBHOOK_ALLOW_HTTP:false}
      allowed-hosts: ${STUDIO_ALERT_WEBHOOK_ALLOWED_HOSTS:}
      connect-timeout-seconds: ${STUDIO_ALERT_WEBHOOK_CONNECT_TIMEOUT_SECONDS:3}
      request-timeout-seconds: ${STUDIO_ALERT_WEBHOOK_REQUEST_TIMEOUT_SECONDS:5}
      max-response-bytes: ${STUDIO_ALERT_WEBHOOK_MAX_RESPONSE_BYTES:16384}
    elink:
      enabled: ${STUDIO_ALERT_ELINK_ENABLED:false}
      service-name: ${STUDIO_ALERT_ELINK_SERVICE_NAME:elink-message-integration}
      path-prefix: ${STUDIO_ALERT_ELINK_PATH_PREFIX:/elink}
      connect-timeout-seconds: ${STUDIO_ALERT_ELINK_CONNECT_TIMEOUT_SECONDS:3}
      request-timeout-seconds: ${STUDIO_ALERT_ELINK_REQUEST_TIMEOUT_SECONDS:10}
      max-error-response-bytes: ${STUDIO_ALERT_ELINK_MAX_ERROR_RESPONSE_BYTES:16384}
      max-option-response-bytes: ${STUDIO_ALERT_ELINK_MAX_OPTION_RESPONSE_BYTES:1048576}
  schema:
    auto-upgrade-on-startup: true
  aggregation-home: ${STUDIO_AGGREGATION_HOME:${aggregation.home:../../package_all/aggregation}}
  encryption-secret: studio-secret-key
  worker-code: studio-desktop-worker
  desktop-runtime: true
