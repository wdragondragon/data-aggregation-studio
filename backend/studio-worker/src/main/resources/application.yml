server:
  port: 18081

spring:
  application:
    name: studio-worker
  profiles:
    active: ${APP_ACTIVE:prod}
  config:
    import:
      - optional:nacos:${spring.application.name}-${spring.profiles.active}.${spring.cloud.nacos.config.file-extension}
  mvc:
    formcontent:
      filter:
        enabled: false
    async:
      request-timeout: ${STUDIO_MVC_ASYNC_REQUEST_TIMEOUT:300000}
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://192.168.188.129:3306/data_aggregation_studio?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true}
    username: ${SPRING_DATASOURCE_USERNAME:root}
    password: ${SPRING_DATASOURCE_PASSWORD:951753}
    driver-class-name: ${SPRING_DATASOURCE_DRIVER_CLASS_NAME:com.mysql.cj.jdbc.Driver}
  jackson:
    serialization:
      write-dates-as-timestamps: false
  cloud:
    nacos:
      username: ${NACOS_USER:nacos}
      password: ${NACOS_PASSWORD:Wjoms_2020}
      discovery:
        enabled: true
        server-addr: ${NACOS_SERVER:127.0.0.1:8848}
        namespace: ${NACOS_NAMESPACE:ZCYY}
        group: ${NACOS_GROUP:ZCYY_GROUP}
      config:
        enabled: true
        server-addr: ${NACOS_SERVER:127.0.0.1:8848}
        namespace: ${NACOS_NAMESPACE:ZCYY}
        group: ${NACOS_GROUP:ZCYY_GROUP}
        file-extension: yaml
        import-check:
          enabled: false
  data:
    redis:
      host: ${REDIS_HOST:172.16.20.19}
      port: ${REDIS_PORT:6379}
      database: ${REDIS_DATABASE:1}
      password: '${REDIS_PASSWORD:&gGEa4E3ea4#5}'
  arthas:
    enabled: ${SPRING_ARTHAS_ENABLED:true}

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true

management:
  endpoints:
    web:
      exposure:
        include: health,info

studio:
  streaming-history:
    cleanup-enabled: ${STUDIO_STREAMING_HISTORY_CLEANUP_ENABLED:false}
    retention-days: ${STUDIO_STREAMING_HISTORY_RETENTION_DAYS:30}
    cleanup-interval-millis: ${STUDIO_STREAMING_HISTORY_CLEANUP_INTERVAL_MILLIS:3600000}
    cleanup-batch-size: ${STUDIO_STREAMING_HISTORY_CLEANUP_BATCH_SIZE:1000}
    cleanup-max-batches: ${STUDIO_STREAMING_HISTORY_CLEANUP_MAX_BATCHES:20}
  schema:
    auto-upgrade-on-startup: false
  aggregation-home: ${STUDIO_AGGREGATION_HOME:}
  encryption-secret: ${STUDIO_ENCRYPTION_SECRET:}
  instance-id: ${STUDIO_INSTANCE_ID:${POD_UID:${HOSTNAME:studio-worker-local}}}
  pod-name: ${POD_NAME:${HOSTNAME:studio-worker-local}}
  node-name: ${NODE_NAME:}
  runtime-cluster-code: ${STUDIO_CLUSTER_CODE:}
  runtime-version: ${STUDIO_RUNTIME_VERSION:}
  plugin-fingerprint: ${STUDIO_PLUGIN_FINGERPRINT:}
  plugin-runtime:
    mode: ${STUDIO_PLUGIN_RUNTIME_MODE:EAGER_LOCAL}
    bucket: ${STUDIO_PLUGIN_BUCKET:}
    prefix: ${STUDIO_PLUGIN_PREFIX:aggregation-plugins}
    channel: ${STUDIO_PLUGIN_CHANNEL:production}
    refresh-interval-seconds: ${STUDIO_PLUGIN_REFRESH_INTERVAL_SECONDS:30}
    refresh-jitter-seconds: ${STUDIO_PLUGIN_REFRESH_JITTER_SECONDS:10}
    cold-load-timeout-seconds: ${STUDIO_PLUGIN_COLD_LOAD_TIMEOUT_SECONDS:300}
    max-artifact-bytes: ${STUDIO_PLUGIN_MAX_ARTIFACT_BYTES:536870912}
    max-extracted-bytes: ${STUDIO_PLUGIN_MAX_EXTRACTED_BYTES:1073741824}
    max-entry-count: ${STUDIO_PLUGIN_MAX_ENTRY_COUNT:5000}
    cache-max-bytes: ${STUDIO_PLUGIN_CACHE_MAX_BYTES:10737418240}
    retained-releases: ${STUDIO_PLUGIN_RETAINED_RELEASES:2}
  worker-group-code: ${STUDIO_WORKER_GROUP_CODE:${STUDIO_WORKER_CODE:${HOSTNAME:studio-online-worker-01}}}
  worker-code: ${STUDIO_WORKER_CODE:${HOSTNAME:studio-online-worker-01}}
  runtime-log-dir: ${STUDIO_RUNTIME_LOG_DIR:./runtime/run-logs}
  worker-api-base-url: ${STUDIO_WORKER_API_BASE_URL:http://127.0.0.1:${server.port}}
  internal-api-token: ${STUDIO_INTERNAL_API_TOKEN:}
  file-transfer:
    enabled: ${STUDIO_FILE_TRANSFER_ENABLED:true}
    event-mode: ${STUDIO_FILE_TRANSFER_EVENT_MODE:OUTBOX}
    event-poll-delay-millis: ${STUDIO_FILE_TRANSFER_EVENT_POLL_DELAY_MILLIS:250}
    event-batch-size: ${STUDIO_FILE_TRANSFER_EVENT_BATCH_SIZE:500}
    progress-event-interval-millis: ${STUDIO_FILE_TRANSFER_PROGRESS_EVENT_INTERVAL_MILLIS:1000}
    replay-max-events: ${STUDIO_FILE_TRANSFER_REPLAY_MAX_EVENTS:5000}
    event-retention-days: ${STUDIO_FILE_TRANSFER_EVENT_RETENTION_DAYS:7}
    cursor-stale-hours: ${STUDIO_FILE_TRANSFER_CURSOR_STALE_HOURS:48}
    cleanup-interval-millis: ${STUDIO_FILE_TRANSFER_CLEANUP_INTERVAL_MILLIS:3600000}
    cleanup-batch-size: ${STUDIO_FILE_TRANSFER_CLEANUP_BATCH_SIZE:1000}
    cleanup-max-batches: ${STUDIO_FILE_TRANSFER_CLEANUP_MAX_BATCHES:20}
  flink:
    enabled: ${STUDIO_FLINK_ENABLED:true}
    execution-mode: ${STUDIO_FLINK_EXECUTION_MODE:embedded}
    runtime-endpoint: ${STUDIO_FLINK_RUNTIME_ENDPOINT:${studio.worker-api-base-url}}
    query-timeout-seconds: ${STUDIO_FLINK_QUERY_TIMEOUT_SECONDS:120}
    gateway:
      base-url: ${STUDIO_FLINK_GATEWAY_BASE_URL:http://127.0.0.1:8083}
      rest-address: ${STUDIO_FLINK_GATEWAY_REST_ADDRESS:}
      rest-port: ${STUDIO_FLINK_GATEWAY_REST_PORT:}
      connect-timeout-seconds: ${STUDIO_FLINK_GATEWAY_CONNECT_TIMEOUT_SECONDS:10}
      fetch-timeout-seconds: ${STUDIO_FLINK_GATEWAY_FETCH_TIMEOUT_SECONDS:120}
      max-result-pages: ${STUDIO_FLINK_GATEWAY_MAX_RESULT_PAGES:1000}
  runtime-invocation-max-body-bytes: ${STUDIO_RUNTIME_INVOCATION_MAX_BODY_BYTES:10485760}
  runtime-invocation-max-concurrency: ${STUDIO_RUNTIME_INVOCATION_MAX_CONCURRENCY:32}
  runtime-invocation-idempotency:
    mode: ${STUDIO_RUNTIME_INVOCATION_IDEMPOTENCY_MODE:OPTIONAL}
    max-response-bytes: ${STUDIO_RUNTIME_INVOCATION_IDEMPOTENCY_MAX_RESPONSE_BYTES:10485760}
    cleanup-enabled: ${STUDIO_RUNTIME_INVOCATION_IDEMPOTENCY_CLEANUP_ENABLED:true}
    completed-retention-days: ${STUDIO_RUNTIME_INVOCATION_IDEMPOTENCY_COMPLETED_RETENTION_DAYS:7}
    running-unknown-after-hours: ${STUDIO_RUNTIME_INVOCATION_IDEMPOTENCY_RUNNING_UNKNOWN_AFTER_HOURS:24}
    cleanup-batch-size: ${STUDIO_RUNTIME_INVOCATION_IDEMPOTENCY_CLEANUP_BATCH_SIZE:1000}
    cleanup-max-batches: ${STUDIO_RUNTIME_INVOCATION_IDEMPOTENCY_CLEANUP_MAX_BATCHES:20}
  runtime-endpoint:
    allowed-hosts: ${STUDIO_RUNTIME_ENDPOINT_ALLOWED_HOSTS:}
    max-response-bytes: ${STUDIO_RUNTIME_ENDPOINT_MAX_RESPONSE_BYTES:10485760}
  gateway:
    trust-enabled: ${STUDIO_GATEWAY_TRUST_ENABLED:false}
    shared-secret: ${STUDIO_GATEWAY_SHARED_SECRET:change-me}
    signature-expire-seconds: ${STUDIO_GATEWAY_SIGNATURE_EXPIRE_SECONDS:300}
  python:
    executable: ${STUDIO_PYTHON_EXECUTABLE:}
    execution-timeout-seconds: ${STUDIO_PYTHON_TIMEOUT_SECONDS:120}
    temp-dir: ${STUDIO_PYTHON_TEMP_DIR:}
  script-environment:
    artifact-connect-timeout-seconds: ${STUDIO_SCRIPT_ARTIFACT_CONNECT_TIMEOUT_SECONDS:5}
    artifact-read-timeout-seconds: ${STUDIO_SCRIPT_ARTIFACT_READ_TIMEOUT_SECONDS:30}
    max-artifact-bytes: ${STUDIO_SCRIPT_ARTIFACT_MAX_BYTES:67108864}
    allow-local-files: ${STUDIO_SCRIPT_ARTIFACT_ALLOW_LOCAL_FILES:false}
    allowed-local-roots: ${STUDIO_SCRIPT_ARTIFACT_ALLOWED_LOCAL_ROOTS:}
  dispatch:
    worker-scheduler-pool-size: ${STUDIO_WORKER_SCHEDULER_POOL_SIZE:4}
    dispatch-lease-minutes: ${STUDIO_DISPATCH_LEASE_MINUTES:10}
    worker-offline-grace-minutes: ${STUDIO_WORKER_OFFLINE_GRACE_MINUTES:120}
  worker:
    streaming:
      max-concurrent: ${STUDIO_WORKER_STREAMING_MAX_CONCURRENT:2}
  object-storage:
    provider: ${STUDIO_OBJECT_PROVIDER:${STUDIO_RUN_LOG_OBJECT_PROVIDER:MINIO}}
    endpoint: ${STUDIO_OBJECT_ENDPOINT:${STUDIO_RUN_LOG_OBJECT_ENDPOINT:}}
    access-key: ${STUDIO_OBJECT_ACCESS_KEY:${STUDIO_RUN_LOG_OBJECT_ACCESS_KEY:}}
    secret-key: ${STUDIO_OBJECT_SECRET_KEY:${STUDIO_RUN_LOG_OBJECT_SECRET_KEY:}}
    bucket: ${STUDIO_OBJECT_BUCKET:${STUDIO_RUN_LOG_OBJECT_BUCKET:}}
    region: ${STUDIO_OBJECT_REGION:${STUDIO_RUN_LOG_OBJECT_REGION:}}
    create-bucket: ${STUDIO_OBJECT_CREATE_BUCKET:${STUDIO_RUN_LOG_OBJECT_CREATE_BUCKET:true}}
  run-log:
    storage-type: ${STUDIO_RUN_LOG_STORAGE_TYPE:LOCAL}
    object-prefix: ${STUDIO_RUN_LOG_OBJECT_PREFIX:studio/run-logs}
    object-storage:
      provider: ${STUDIO_RUN_LOG_OBJECT_PROVIDER:MINIO}
      endpoint: ${STUDIO_RUN_LOG_OBJECT_ENDPOINT:}
      access-key: ${STUDIO_RUN_LOG_OBJECT_ACCESS_KEY:}
      secret-key: ${STUDIO_RUN_LOG_OBJECT_SECRET_KEY:}
      bucket: ${STUDIO_RUN_LOG_OBJECT_BUCKET:}
      region: ${STUDIO_RUN_LOG_OBJECT_REGION:}
      prefix: ${STUDIO_RUN_LOG_OBJECT_PREFIX:studio/run-logs}
      create-bucket: ${STUDIO_RUN_LOG_OBJECT_CREATE_BUCKET:true}
arthas:
  ip: ${ARTHAS_IP:127.0.0.1}
  telnet-port: ${ARTHAS_TELNET_PORT:3658}
  http-port: ${ARTHAS_HTTP_PORT:8563}

  app-name: ${spring.application.name}
  agent-id: ${ARTHAS_AGENT_ID:${spring.application.name}_${studio.instance-id}}

  tunnel-server: ${ARTHAS_TUNNEL_SERVER:ws://127.0.0.1:7777/ws}

  # 开启 MCP Server
  mcp-endpoint: ${ARTHAS_MCP_ENDPOINT:/mcp}
  mcp-protocol: ${ARTHAS_MCP_PROTOCOL:STREAMABLE}

  # 建议通过 Secret 注入，远程暴露时必须配置
  password: ${ARTHAS_PASSWORD:951753}
